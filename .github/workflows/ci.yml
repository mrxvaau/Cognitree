name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Cognitree Unit Tests (the only hard gate) ─────────────────────────────
  test:
    name: Cognitree Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run cognitree test suite (must be 84/84)
        run: bun run vitest run tests/cognitree/ --reporter=verbose

  # ── Lint (informational) ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Biome check (src/)
        run: bun run lint
        continue-on-error: true   # upstream code has known lint issues — informational only

  # ── Type-check (informational) ────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck root
        run: bun run typecheck
        continue-on-error: true   # upstream TS errors — informational only
